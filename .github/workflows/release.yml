name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')
    runs-on: macos-26
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            version="$(awk '$1 == "MURINOOK_RELEASE_VERSION" { print $3 }' Config/Version.xcconfig)"
            [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]]
            RELEASE_TAG="v$version"
            echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git diff --exit-code "$RELEASE_TAG" HEAD -- Config Murinook Murinook.xcodeproj Packages scripts

      - name: Check Xcode toolchain
        run: xcodebuild -version

      - name: Run Swift tests
        run: xcrun swift test --package-path Packages/MurinookKit

      - name: Package universal disk image
        run: ./scripts/package-dmg.sh

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dmg="work/releases/Murinook-${version}-universal.dmg"
          sums='work/releases/SHA256SUMS'
          test -f "$dmg"
          test -f "$sums"
          notes_file="$RUNNER_TEMP/murinook-release-notes.md"
          git for-each-ref --format='%(contents:body)' "refs/tags/$RELEASE_TAG" > "$notes_file"
          cat >> "$notes_file" <<'NOTES'

          ## Installation

          macOS 14 or later · Apple silicon and Intel.

          Open the DMG, quit Murinook, and drag it to Applications, replacing the previous copy. Your existing history and preferences remain in their separate storage.

          This beta is ad-hoc signed and not notarized. macOS may require **Open Anyway** in **System Settings → Privacy & Security**.
          NOTES
          release_args=(--verify-tag --title "$version" --notes-file "$notes_file")
          if [[ "$version" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest=true)
          fi
          gh release create "$RELEASE_TAG" "$dmg" "$sums" "${release_args[@]}"
